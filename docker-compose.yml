services:
  sipp-monitoring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sipp-monitoring
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - ENCRYPT_API_URL=${ENCRYPT_API_URL:-http://192.168.0.141:8080}
      - ENCRYPT_API_KEY=${ENCRYPT_API_KEY:-}
      - SIPP_BASE_URL=${SIPP_BASE_URL:-http://192.168.0.222/SIPP}
    extra_hosts:
      # Memungkinkan container mengakses port host server (misal MySQL lokal di 127.0.0.1)
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
